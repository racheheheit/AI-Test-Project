name: Test Project

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: |
          echo "Running tests..."
          npm test

      - name: Simulate test failure
        run: |
          echo "Simulating a failing test..."
          exit 1